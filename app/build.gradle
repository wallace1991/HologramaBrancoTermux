plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    namespace 'com.example.hologramabranco'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.hologramabranco'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }
}
